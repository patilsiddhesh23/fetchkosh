<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wi-Fi, Phone 5G and Ethernet feed one download in FetchKosh</title>
  <defs>
    <linearGradient id="fk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#f2471c"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#8044C6"/><stop offset="1" stop-color="#E2CFF6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="878" height="278" rx="22" fill="#17141b" stroke="#2b2632"/>

  <path id="p1" d="M232 68 C330 68 340 140 424 140" fill="none" stroke="#8044C6" stroke-width="2"/>
  <path id="p2" d="M232 140 L424 140" fill="none" stroke="#E2CFF6" stroke-width="2" opacity=".85"/>
  <path id="p3" d="M232 212 C330 212 340 140 424 140" fill="none" stroke="#6f6480" stroke-width="2"/>
  <path id="po" d="M496 140 L598 140" fill="none" stroke="#6f6480" stroke-width="2"/>

  <g>
    <circle r="4" fill="#a877e6"><animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#a877e6"><animateMotion dur="2.1s" begin="-0.7s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#a877e6"><animateMotion dur="2.1s" begin="-1.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#E2CFF6"><animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#E2CFF6"><animateMotion dur="2.5s" begin="-1.25s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#cfc6da"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#cfc6da"><animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#cfc6da"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#ffffff"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#po"/></animateMotion></circle>
    <circle r="4" fill="#ffffff"><animateMotion dur="1.2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#po"/></animateMotion></circle>
  </g>

  <!-- the connections -->
  <g font-size="15">
    <rect x="40" y="40" width="192" height="56" rx="14" fill="#111111" stroke="#2b2632"/>
    <circle cx="62" cy="68" r="5" fill="#8044C6"/>
    <text x="78" y="64" fill="#f3f0f7" font-weight="600">Wi-Fi</text><text x="78" y="83" fill="#9d95a8" font-size="13">5.2 MB/s</text>
    <rect x="40" y="112" width="192" height="56" rx="14" fill="#111111" stroke="#2b2632"/>
    <circle cx="62" cy="140" r="5" fill="#E2CFF6"/>
    <text x="78" y="136" fill="#f3f0f7" font-weight="600">Phone 5G</text><text x="78" y="155" fill="#9d95a8" font-size="13">3.9 MB/s</text>
    <rect x="40" y="184" width="192" height="56" rx="14" fill="#111111" stroke="#2b2632"/>
    <circle cx="62" cy="212" r="5" fill="#cfc6da"/>
    <text x="78" y="208" fill="#f3f0f7" font-weight="600">Ethernet</text><text x="78" y="227" fill="#9d95a8" font-size="13">6.1 MB/s</text>
  </g>

  <!-- FetchKosh -->
  <circle cx="460" cy="140" r="36" fill="#111111" stroke="#8044C6" stroke-width="2.5"/>
  <path transform="translate(438 118) scale(0.92)" d="M15 12h20l-3 6H22v5h9l-3 5.5h-6V37h-7z" fill="url(#fk)"/>
  <text x="460" y="198" fill="#9d95a8" font-size="13" text-anchor="middle">FetchKosh</text>

  <!-- the file -->
  <rect x="598" y="88" width="250" height="104" rx="16" fill="#111111" stroke="#2b2632"/>
  <text x="616" y="116" fill="#f3f0f7" font-size="14" font-weight="600">ubuntu-24.04.1-desktop.iso</text>
  <text x="616" y="150" fill="#f3f0f7" font-size="28" font-weight="700">15.2<tspan fill="#9d95a8" font-size="14" font-weight="400"> MB/s</tspan></text>
  <rect x="616" y="162" width="214" height="7" rx="3.5" fill="#2a2630"/>
  <rect x="616" y="162" width="0" height="7" rx="3.5" fill="url(#bar)">
    <animate attributeName="width" values="0;214;214" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="616" y="184" fill="#9d95a8" font-size="12">Wi-Fi + Phone 5G + Ethernet together</text>
</svg>
