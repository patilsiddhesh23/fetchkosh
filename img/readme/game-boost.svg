<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Game Boost: Wi-Fi and the phone's 5G both feed FetchKosh, which feeds Steam and Epic Games</title>
  <defs>
    <linearGradient id="fk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#f2471c"/></linearGradient>
    <symbol id="pad" viewBox="0 0 24 24"><g fill="none" stroke="#E2CFF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4.5 4.5 0 0 1 4.3 5.8l-1 3.4a2.3 2.3 0 0 1-3.9.9L14.5 16h-5l-1.9 2.1a2.3 2.3 0 0 1-3.9-.9l-1-3.4A4.5 4.5 0 0 1 7 8Z"/><path d="M8 11v3M6.5 12.5h3M15.5 12h.01M17.5 13.5h.01" stroke-width="2.2"/></g></symbol>
  </defs>
  <rect x="1" y="1" width="878" height="268" rx="22" fill="#17141b" stroke="#2b2632"/>

  <path id="gw" d="M210 80 C320 80 340 125 410 125" fill="none" stroke="#8044C6" stroke-width="2"/>
  <path id="g5" d="M210 170 C320 170 340 125 410 125" fill="none" stroke="#E2CFF6" stroke-width="2" opacity=".85"/>
  <path id="gs" d="M486 125 C560 125 570 82 640 82" fill="none" stroke="#6f6480" stroke-width="2"/>
  <path id="ge" d="M486 125 C560 125 570 168 640 168" fill="none" stroke="#6f6480" stroke-width="2"/>
  <g>
    <circle r="4" fill="#a877e6"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#gw"/></animateMotion></circle>
    <circle r="4" fill="#a877e6"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#gw"/></animateMotion></circle>
    <circle r="4" fill="#E2CFF6"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#g5"/></animateMotion></circle>
    <circle r="4" fill="#E2CFF6"><animateMotion dur="2.6s" begin="-1.3s" repeatCount="indefinite"><mpath href="#g5"/></animateMotion></circle>
    <circle r="4" fill="#ffffff"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#gs"/></animateMotion></circle>
    <circle r="4" fill="#ffffff"><animateMotion dur="1.5s" begin="-0.75s" repeatCount="indefinite"><mpath href="#ge"/></animateMotion></circle>
  </g>

  <g font-size="17" font-weight="600" fill="#f3f0f7">
    <text x="60" y="86">Wi-Fi</text>
    <text x="60" y="176">Phone 5G</text>
  </g>
  <circle cx="448" cy="125" r="36" fill="#111111" stroke="#8044C6" stroke-width="2.5"/>
  <path transform="translate(426 103) scale(0.92)" d="M15 12h20l-3 6H22v5h9l-3 5.5h-6V37h-7z" fill="url(#fk)"/>
  <text x="448" y="183" fill="#9d95a8" font-size="13" text-anchor="middle">FetchKosh</text>

  <rect x="640" y="54" width="190" height="56" rx="15" fill="#111111" stroke="#2b2632"/>
  <use href="#pad" x="654" y="68" width="28" height="28"/>
  <text x="692" y="88" fill="#f3f0f7" font-size="17" font-weight="600">Steam</text>
  <rect x="640" y="140" width="190" height="56" rx="15" fill="#111111" stroke="#2b2632"/>
  <use href="#pad" x="654" y="154" width="28" height="28"/>
  <text x="692" y="174" fill="#f3f0f7" font-size="17" font-weight="600">Epic Games</text>

  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#9d95a8">The launcher still downloads and installs the game. FetchKosh fetches its pieces over every connection.</text>
</svg>
