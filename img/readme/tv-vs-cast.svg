<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Screen casting mirrors your phone's screen; FetchKosh sends the file itself to the TV and your phone becomes the remote</title>
  <rect x="1" y="1" width="878" height="328" rx="22" fill="#17141b" stroke="#2b2632"/>
  <line x1="440" y1="24" x2="440" y2="306" stroke="#2b2632"/>

  <!-- left: screen casting -->
  <text x="40" y="52" font-size="18" font-weight="700" fill="#9d95a8">Screen casting</text>
  <path id="cl" d="M120 128 L300 128" fill="none" stroke="#4a4257" stroke-width="2" stroke-dasharray="6 6"/>
  <circle r="4" fill="#9d95a8">
    <animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;0.35;0.35;0.7;0.7;1" keyTimes="0;0.25;0.45;0.6;0.85;1" calcMode="linear"><mpath href="#cl"/></animateMotion>
  </circle>
  <g fill="none" stroke="#9d95a8" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="70" y="92" width="44" height="76" rx="9"/>
    <rect x="300" y="96" width="104" height="64" rx="6"/>
    <path d="M336 174 H368"/>
  </g>
  <rect x="76" y="100" width="32" height="56" rx="4" fill="#3a3346">
    <animate attributeName="opacity" values="1;.55;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="306" y="102" width="92" height="52" rx="3" fill="#3a3346">
    <animate attributeName="opacity" values=".6;1;.6" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <g font-size="14" fill="#9d95a8">
    <text x="40" y="214">• Copies your whole screen, picture by picture</text>
    <text x="40" y="238">• Video is squeezed again on the way: softer picture</text>
    <text x="40" y="262">• Phone screen stays on and busy the whole time</text>
    <text x="40" y="286">• Lag when you skip or pause</text>
  </g>

  <!-- right: FetchKosh -->
  <text x="480" y="52" font-size="18" font-weight="700" fill="#E2CFF6">FetchKosh</text>
  <path id="fl" d="M562 128 L742 128" fill="none" stroke="#E2CFF6" stroke-width="2" opacity=".85"/>
  <circle r="4.5" fill="#E2CFF6"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#fl"/></animateMotion></circle>
  <circle r="4.5" fill="#E2CFF6"><animateMotion dur="1.4s" begin="-0.47s" repeatCount="indefinite"><mpath href="#fl"/></animateMotion></circle>
  <circle r="4.5" fill="#E2CFF6"><animateMotion dur="1.4s" begin="-0.93s" repeatCount="indefinite"><mpath href="#fl"/></animateMotion></circle>
  <g fill="none" stroke="#f3f0f7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="512" y="92" width="44" height="76" rx="9"/>
    <rect x="742" y="96" width="104" height="64" rx="6"/>
    <path d="M778 174 H810"/>
  </g>
  <!-- the phone is a remote: play button and a seek bar -->
  <circle cx="534" cy="120" r="9" fill="#8044C6"/>
  <path d="M531 115 L539 120 L531 125 Z" fill="#ffffff"/>
  <rect x="520" y="142" width="28" height="3" rx="1.5" fill="#4a4257"/>
  <rect x="520" y="142" width="12" height="3" rx="1.5" fill="#E2CFF6"/>
  <!-- the TV plays the real file -->
  <rect x="748" y="102" width="92" height="52" rx="3" fill="#2a1d3a"/>
  <path d="M786 118 L802 128 L786 138 Z" fill="#E2CFF6"/>
  <g font-size="14" fill="#d8d8d8">
    <text x="480" y="214">• Plays the original file on the TV, full quality</text>
    <text x="480" y="238">• Your phone is the remote: play, skip, volume, subtitles</text>
    <text x="480" y="262">• Instant skipping, no mirroring lag</text>
    <text x="480" y="286">• Over home Wi-Fi: no internet needed</text>
  </g>
</svg>
