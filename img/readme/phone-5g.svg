<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Phone 5G for your PC: the phone fetches parts over mobile data and passes them to the PC over home Wi-Fi</title>
  <rect x="1" y="1" width="878" height="318" rx="22" fill="#17141b" stroke="#2b2632"/>

  <!-- paths: 5G tower to phone, phone to PC over Wi-Fi, router to PC -->
  <path id="t5" d="M150 92 C240 92 260 92 330 92" fill="none" stroke="#E2CFF6" stroke-width="2" opacity=".85"/>
  <path id="pp" d="M420 110 C520 110 560 160 650 160" fill="none" stroke="#E2CFF6" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path id="rp" d="M150 232 C320 232 520 200 650 176" fill="none" stroke="#8044C6" stroke-width="2"/>

  <g>
    <circle r="4.5" fill="#E2CFF6"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#t5"/></animateMotion></circle>
    <circle r="4.5" fill="#E2CFF6"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#t5"/></animateMotion></circle>
    <circle r="4.5" fill="#E2CFF6"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pp"/></animateMotion></circle>
    <circle r="4.5" fill="#E2CFF6"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#pp"/></animateMotion></circle>
    <circle r="4.5" fill="#a877e6"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#rp"/></animateMotion></circle>
    <circle r="4.5" fill="#a877e6"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite"><mpath href="#rp"/></animateMotion></circle>
    <circle r="4.5" fill="#a877e6"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite"><mpath href="#rp"/></animateMotion></circle>
  </g>

  <g fill="none" stroke="#f3f0f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 5G tower -->
    <path d="M96 118 L110 62 L124 118 M102 96 H118 M110 62 V54"/>
    <path d="M90 62 a20 20 0 0 1 0 -20 M130 42 a20 20 0 0 1 0 20" stroke="#E2CFF6"/>
    <!-- router -->
    <rect x="84" y="222" width="56" height="22" rx="5"/>
    <path d="M94 222 V206 M130 222 V206"/>
    <!-- phone -->
    <rect x="344" y="58" width="44" height="76" rx="9"/>
    <path d="M360 124 H372"/>
    <!-- PC -->
    <rect x="650" y="134" width="96" height="62" rx="6"/>
    <path d="M680 216 H716 M698 196 V216"/>
  </g>
  <g font-size="14" fill="#9d95a8">
    <text x="110" y="142" text-anchor="middle" fill="#f3f0f7" font-weight="600">5G tower</text>
    <text x="112" y="268" text-anchor="middle" fill="#f3f0f7" font-weight="600">Home Wi-Fi</text>
    <text x="366" y="158" text-anchor="middle" fill="#f3f0f7" font-weight="600">Phone</text>
    <text x="698" y="240" text-anchor="middle" fill="#f3f0f7" font-weight="600">Windows PC</text>
    <text x="240" y="80" text-anchor="middle">mobile data</text>
    <text x="520" y="96" text-anchor="middle">parts, over your Wi-Fi</text>
    <text x="400" y="246" text-anchor="middle">the PC's own Wi-Fi</text>
  </g>
  <text x="440" y="298" text-anchor="middle" font-size="13" fill="#9d95a8">No hotspot: the PC stays on your Wi-Fi, and HTTPS stays encrypted end to end. Your daily data limit still applies.</text>
</svg>
